# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for your HydraDB key. Visitors add their own AI keys in the app's Settings.
services:
  - type: web
    name: whybot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HYDRA_DB_API_KEY        # from hydradb.com dashboard
        sync: false
      - key: HYDRA_DATABASE          # separate from your local demo brain
        value: whybotpublic
      - key: PUBLIC_MODE
        value: "1"
      - key: AUTO_SAMPLE
        value: "1"
      - key: RATE_AI_PER_MIN
        value: "12"
      - key: RATE_INGEST_PER_HOUR
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: ADMIN_TOKEN             # lets you (only) reset the public brain
        generateValue: true
